[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scg"
version = "0.1.0"
description = "Security Coverage Graph — local SQLite-backed library and CLI"
requires-python = ">=3.11"
# No runtime dependencies: sqlite3 is Python stdlib.

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scg = "scg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scg = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
